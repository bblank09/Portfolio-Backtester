[project]
name = "sec-open-data-portfolio-backtester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "pyarrow>=16.0",
  "slowapi>=0.1.9",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs>=2.2", "scipy-stubs>=1.13", "pyyaml>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.mypy]
explicit_package_bases = true

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["app*", "data*", "docs*", "exports*", "frontend*", "research*", "scripts*"]
