name: Nightly Backup

on:
  schedule:
    # 18:00 UTC == 01:00 Asia/Bangkok
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are configured
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.BACKUP_TOKEN }}" ]; then
            echo "::error::APP_URL and/or BACKUP_TOKEN repo secrets are not set -- see README for setup." >&2
            exit 1
          fi

      - name: Download runs export from the running app
        run: |
          curl -sf -o /tmp/runs-export.zip \
            "${APP_URL%/}/api/v1/admin/export-runs?token=${BACKUP_TOKEN}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}

      - name: Checkout backup-data branch
        uses: actions/checkout@v4
        with:
          ref: backup-data
          fetch-depth: 1

      - name: Extract export into a dated folder and commit
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          mkdir -p "backups/$STAMP"
          unzip -o -q /tmp/runs-export.zip -d "backups/$STAMP"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "backups/$STAMP"
          if git diff --cached --quiet; then
            echo "Nothing new to back up for $STAMP."
          else
            git commit -m "backup: runs snapshot for $STAMP"
            git push origin backup-data
          fi
